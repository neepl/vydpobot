[project]
name = "vydpobot"
version = "0.1.0"
description = "Telegram bot that monitors a Deye hybrid inverter via Solarman (vydpobot)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[job-queue]>=21.6",
    "httpx>=0.27",
    "pydantic-settings>=2.7",
    "matplotlib>=3.9",
    "tzdata>=2026.5",
]

[project.scripts]
vydpobot = "vydpobot.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vydpobot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
